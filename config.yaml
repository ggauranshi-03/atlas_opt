experiment:
  wandb_project: "Atlas-Experiments"
  train_epochs: 10
  batch_size: 16
  grad_acc: 4
  train_subset: 20000
  dataset_name: "cais/mmlu"
  dataset_config: "all"
  model_name: "unsloth/Llama-3.2-1B"
  num_labels: 4
  max_len: 256

hyperparameters:
  adam:
    lr: 0.0003
    weight_decay: 0.01

  sgd:
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.01

  muon:
    lr: 0.02
    weight_decay: 0.01

  atlas_exp1:
    lr: 0.02
    weight_decay: 0.01
    rho: 0.001
    rho_vector: 0.05

  atlas_exp2:
    lr: 0.02
    weight_decay: 0.01
    rho: 0.05
    rho_vector: 0.05

  atlas_exp3:
    lr: 0.02
    weight_decay: 0.01
    rho: 0.05
    rho_vector: 0.05
