# Two matrices (L = 2) with a ReLU between them: logits = relu(X W1^T) W2^T, W1: 32x64, W2: 32x32.
# A genuine nonlinear classifier, not a linear product -- see objective_nn.py. Labels are the
# argmax class of a same-shaped teacher network (exactly realizable by this architecture). F* is
# the teacher network's own achieved training loss (see objective_nn.make_problem_nn), not a
# proven global minimum -- cross-entropy has no closed form minimizer for a constrained ReLU net.
name: nn_two_matrix_anisotropic

problem:
  depth: 2
  d: 64                   # input dimension
  k: 32                   # number of classes
  hidden: 32              # hidden width of the 2-layer ReLU network
  n_train: 512
  cond_x: 100.0           # condition number of the input covariance Sigma
  label_flip_prob: 0.0    # probability of a uniform-random label flip (0 = clean labels)
  ridge: 0.0              # ridge/2 (||W_1||_F^2 + ||W_2||_F^2)
  data_seed: 1729
  init_seed: 31415
  init_scale: 1.0         # W_l ~ N(0, init_scale^2 / fan_in), identical for all seeds (like the paper's fixed x0)
  constraint: spectral    # spectral | entrywise | none   (projection after every step)
  radius_factor: 3.0      # R = factor * ||W_0||_2 * 10 -- a generous margin, no feasibility proof (see objective_nn.py)
  loss_type: nn_ce
  n_val: 512              # held-out validation samples, drawn from the same distribution as training

noise:
  model: additive         # label (backpropagated per-sample Pareto noise) | additive (paper, entrywise)
  cond_noise: 10.0        # > 1.0 creates Kronecker-structured anisotropic noise matrices
  scale: 1.0              # median |noise| (label units for 'label', x init-gradient RMS for 'additive')
  batch_size: 64          # null = full batch
  alphas: [1.1, 1.3, 1.6, 2.0, 3.0, inf]   # inf = Gaussian noise with the same median
  allow_undefined_mean: false

run:
  steps: 500
  seeds: 8                # reduced from 32 for massive speedup
  seed_offset: 0
  log_every: 10
  sharpness_every: 0      # disabled for speed
  sharpness_iters: 30
  schedule: cosine        # constant | cosine | power   (power: (1+t)^-schedule_power, may be "1/alpha")
  min_lr_fraction: 0.01
  schedule_power: 0.5
  divergence_factor: 1000.0
  dtype: float64

sam:
  rhos: [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0]
  rho_units: nominal      # nominal (as implemented) | matched_frobenius (every method's ||eps||_F = rho)
  frobenius_modes: [global, per-layer]
  ortho: ns5              # ns5 (as in atlas_opt) | svd (exact polar factor) for spectral perturbations
  ns_steps: 5
  friendly_lambda: 0.9
  friendly_sigma: 1.0

optim:
  muon_momentum: 0.95
  sgd_momentum: 0.0
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  clip_factor: 1.0        # Clip-SGD threshold = factor * ||grad F(W_0)||_F
  weight_decay: 0.0
  lr:                     # fallback when no tuned_lrs.json exists
    sgd: 1.0
    clip_sgd: 1.0
    adam: 0.003
    muon: 0.02
    nsgdm: 0.02

tuning:
  seeds: 16
  seed_offset: 100000     # disjoint from evaluation seeds
  max_divergence_rate: 0.25
  lr_grid:
    sgd: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0, 30.0]
    clip_sgd: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0, 30.0]
    adam: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03]
    muon: [0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1]
    nsgdm: [0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1]

algorithms:
  - sgd
  - muon
  - random-spectral-sam-muon
  - full-spectral-sam-muon
  - lazy-spectral-sam-muon
  - spectral-friendly-sam-muon
  - stale-friendly-spectral-sam-muon
  - stale-momentum-friendly-spectral-sam-muon
