experiment:
  experiment_id: cifar10_v2
  wandb_project: V2-PTQ-CIFAR10
  task_type: image_classification
  dataset_name: cifar10
  model_name: airbench_cnn
  num_classes: 10
  image_size: 32
  total_training_steps: 720
  seeds: 50
batch_size: 500
grad_acc: 1
parameter_routing:
  conv_weights: muon
  normalization_and_biases: sgd
optimizers:
  adam:
    optimizer: adam
    lr: 0.0316228
    weight_decay: 0.0005
  sgd:
    optimizer: sgd
    lr: 0.3
    momentum: 0.9
    nesterov: true
    weight_decay: 0.0005
  muon:
    optimizer: muon
    lr: 0.03
    momentum: 0.95
    weight_decay: 0.0
    adam_lr: 0.0012
  sam:
    optimizer: sam
    lr: 0.3
    momentum: 0.9
    nesterov: true
    weight_decay: 0.0005
    rho: 0.003
    fsam_lambda: 0.9
    fsam_sigma: 1.0
    rho_vector: 0.003
  fsam:
    optimizer: fsam
    lr: 0.3
    momentum: 0.9
    nesterov: true
    weight_decay: 0.0005
    rho: 0.000948683
    fsam_lambda: 0.9
    fsam_sigma: 1.0
    rho_vector: 0.000948683
  muon_sam:
    optimizer: muon_sam
    lr: 0.03
    momentum: 0.95
    weight_decay: 0.0
    adam_lr: 0.0012
    rho: 0.01
    rho_vector: 0.01
    ns_steps: 5
    fsam_lambda: 0.9
    fsam_sigma: 1.0
  fsam_ortho_muon:
    optimizer: fsam_ortho_muon
    lr: 0.03
    momentum: 0.95
    weight_decay: 0.0
    adam_lr: 0.0012
    rho: 0.01
    rho_vector: 0.01
    ns_steps: 5
    fsam_lambda: 0.9
    fsam_sigma: 1.0
  fsam_ortho_muon_stale_momentum:
    optimizer: fsam_ortho_muon_stale_momentum
    lr: 0.03
    momentum: 0.95
    weight_decay: 0.0
    adam_lr: 0.0012
    rho: 0.003
    rho_vector: 0.003
    ns_steps: 5
    fsam_lambda: 0.9
    fsam_sigma: 1.0
  randsam_muon:
    optimizer: randsam_muon
    lr: 0.03
    momentum: 0.95
    weight_decay: 0.0
    adam_lr: 0.0012
    rho: 0.1
    rho_vector: 0.1
    ns_steps: 5
    fsam_lambda: 0.9
    fsam_sigma: 1.0
  soma_prens5:
    optimizer: soma_prens5
    lr: 0.03
    momentum: 0.95
