experiment:
  experiment_id: nanogpt_fineweb
  wandb_project: NanoGPT-FineWeb-Optimizers
  task_type: causal_lm
  model_name: gpt2
  model_config:
    n_layer: 12
    n_head: 12
    n_embd: 768
    vocab_size: 50257
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-10BT
  max_len: 2048
  total_training_steps: 1500
  val_tokens: 10485760
batch_size: 16
grad_acc: 32
parameter_routing:
  hidden_matrices: muon
  embeddings_and_head: adamw
optimizers:
  adam:
    optimizer: adam
    lr: 0.0018
    betas:
    - 0.9
    - 0.95
    weight_decay: 0.01
  sgd:
    optimizer: sgd
    lr: 0.05
    momentum: 0.95
    nesterov: true
    weight_decay: 0.01
  muon:
    optimizer: muon
    lr: 0.015
    momentum: 0.9665
    momentum_type: nesterov
    weight_decay: 0.0001
    solver: quintic_theoretical
    steps_q: 7
  muon_sam:
    optimizer: muon_sam
    lr: 0.015
    momentum: 0.9665
    weight_decay: 0.0001
    rho: 0.0015
    rho_vector: 0.01
  atlas:
    optimizer: atlas
    lr: 0.015
    momentum: 0.9665
    weight_decay: 0.0001
    rho: 0.0015
    rho_vector: 0.01
  atlas_raw:
    optimizer: atlas_raw
    lr: 0.015
    momentum: 0.9665
    weight_decay: 0.0001
    rho: 0.0015
    rho_vector: 0.01
  atlas_random:
    optimizer: atlas_random
    lr: 0.015
    momentum: 0.9665
    weight_decay: 0.0001
    rho: 0.0015
    rho_vector: 0.01
  muon_sam_frob:
    optimizer: muon_sam_frob
    lr: 0.015
    momentum: 0.9665
    weight_decay: 0.0001
    rho: 0.0015
    rho_vector: 0.01
  muon_sam_stale:
    optimizer: muon_sam_stale
    lr: 0.015
    momentum: 0.9665
    weight_decay: 0.0001
    rho: 0.0015
    rho_vector: 0.01
