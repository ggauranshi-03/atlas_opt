# ==============================================================================
# PAPER 1 - EXPERIMENT 3: Small CNN on CIFAR-10 (Optimizer Comparison)
# Reference: Choudhury et al. (2026), Section 4.2, Table 2 & Figure 1c
# ==============================================================================

experiment:
  experiment_id: "paper1_exp3_cifar10_cnn"
  wandb_project: "CIFAR10-CNN-Optimizers"
  task_type: "image_classification"

  # Model & Dataset (Paper 1 Section 4.2 & Appendix E.3):
  dataset_name: "cifar10"
  model_name: "airbench_cnn"            # CIFAR-10 Airbench CNN architecture
  num_classes: 10
  image_size: 32
  total_training_steps: 720             # 720 steps on Airbench
  seeds: 50                             # Averaged over 50 random seeds in paper

# Batch Size (Paper 1 Section 4.2):
batch_size: 500
grad_acc: 1

# Parameter Routing Convention (Paper 1 Appendix E.3):
# 4D Conv filter weights -> Muon / Atlas
# Normalization layers & linear head -> SGD with Nesterov momentum
parameter_routing:
  conv_weights: "muon"
  normalization_and_biases: "sgd"

optimizers:
  adamw_baseline:
    optimizer: "adamw"
    lr: 0.001
    weight_decay: 0.001

  sgd_nesterov_baseline:
    optimizer: "sgd"
    lr: 0.0001
    momentum: 0.9
    nesterov: true
    weight_decay: 0.001

  muon_polyak:
    optimizer: "muon"
    lr: 0.03
    momentum: 0.9665
    momentum_type: "polyak"
    weight_decay: 0.001
    solver: "quintic_theoretical"
    steps_q: 7

  muon_nesterov:
    optimizer: "muon"
    lr: 0.03
    momentum: 0.9665
    momentum_type: "nesterov"
    weight_decay: 0.001
    solver: "quintic_theoretical"
    steps_q: 7

  rand_muon_polyak:
    optimizer: "muon"
    lr: 0.03
    momentum: 0.9665
    momentum_type: "polyak"
    weight_decay: 0.001
    randomized: true
    sketch_type: "gaussian"
    target_rank_s: 128
    oversampling_p: 10
    power_iteration_h: 2
    solver: "quintic_theoretical"
    steps_q: 7

  rand_muon_nesterov_gaussian:
    optimizer: "muon"
    lr: 0.03
    momentum: 0.9665
    momentum_type: "nesterov"
    weight_decay: 0.001
    randomized: true
    sketch_type: "gaussian"
    target_rank_s: 128
    oversampling_p: 10
    power_iteration_h: 2
    solver: "quintic_theoretical"
    steps_q: 7

  rand_muon_nesterov_kaczmarz:
    optimizer: "muon"
    lr: 0.03
    momentum: 0.9665
    momentum_type: "nesterov"
    weight_decay: 0.001
    randomized: true
    sketch_type: "kaczmarz"
    target_rank_s: 128
    oversampling_p: 10
    power_iteration_h: 2
    solver: "quintic_theoretical"
    steps_q: 7

  atlas_exp1:
    optimizer: "atlas"
    lr: 0.02
    momentum: 0.9665
    weight_decay: 0.0001
    rho: 0.0015
    rho_vector: 0.01
