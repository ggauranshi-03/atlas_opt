# ==============================================================================
# PAPER 1 - EXPERIMENT 2: nanoGPT on FineWeb10B - Ablation Studies
# Reference: Choudhury et al. (2026), Section 4.1 & Appendix E.4
# Figures: Fig 1b (Rank s), Fig 2a (Steps q), Fig 2b (Sketch), Fig 3a (Solver), Fig 3b (SeqLen)
# ==============================================================================

experiment:
  experiment_id: "nanogpt_ablations"
  wandb_project: "Paper1-Muon-Ablations"
  task_type: "causal_lm"

  # Model: 135M parameter nanoGPT
  model_name: "gpt2"
  dataset_name: "HuggingFaceFW/fineweb-edu"
  dataset_config: "sample-10BT"
  max_len: 2048
  total_training_steps: 1490

batch_size: 16
grad_acc: 32

# ------------------------------------------------------------------------------
# Ablation Dimensions (Vary one while keeping others at default):
# ------------------------------------------------------------------------------
ablations:
  # 1. Randomized Rank s (Figure 1b):
  # Evaluates validation perplexity as rank grows from s=100 (13% rank) to s=400 (52% rank)
  rank_s_sweep:
    values: [100, 200, 300, 400]
    default: 200

  # 2. Inner-Iteration Steps q (Figure 2a):
  # Evaluates how many polynomial steps are needed for polar factor convergence
  steps_q_sweep:
    values: [1, 3, 5, 7, 9]
    default: 7

  # 3. Sketching Mechanism (Figure 2b):
  # Dense Gaussian sketch vs Kaczmarz sparse column selection
  sketching_sweep:
    values: ["gaussian", "kaczmarz"]
    default: "gaussian"

  # 4. Inexact Solver Type (Figure 3a):
  solvers:
    quintic_theoretical:
      degree: 5
      coefficients: [1.8750, -1.2500, 0.3750]  # (15/8, -10/8, 3/8)
    cubic:
      degree: 3
      coefficients: [1.5000, -0.5000]          # (3/2, -1/2)
    quintic_empirical:
      degree: 5
      coefficients: [3.4445, -4.7750, 2.0315]
    polarexpress:
      degree: 5
      type: "iteration_dependent"
      steps: 9

  # 5. Sequence Length (Figure 3b):
  seq_len_sweep:
    values: [1024, 2048, 4096]
    default: 2048

hyperparameters:
  muon:
    lr: 0.0325
    momentum: 0.9665
    momentum_type: "nesterov"
    weight_decay: 0.01

  atlas:
    lr: 0.015
    momentum: 0.9665
    weight_decay: 0.0001
    rho: 0.0015
    rho_vector: 0.01
