experiment:
  experiment_id: pythia70m_pretrain_chinchilla
  wandb_project: Pythia70M-Fineweb-optimizers
  task_type: causal_lm
  model_name: EleutherAI/pythia-70m
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-10BT
  max_len: 2048
  total_tokens: 1400000000
  train_epochs: 14
batch_size: 16
grad_acc: 32
lr_schedule:
  type: wsd
  warmup_ratio: 0.05
  cooldown_ratio: 0.2
  min_lr_ratio: 0.0
parameter_routing:
  hidden_matrices: muon
  embeddings_and_head: adamw
optimizers:
  adam:
    optimizer: adam
    lr: 0.0018
    betas:
    - 0.9
    - 0.95
    weight_decay: 0.01
  sgd:
    optimizer: sgd
    lr: 0.001
    momentum: 0.95
    weight_decay: 0.1
    schatten_r: 2.0
  muon:
    optimizer: muon
    lr: 0.015
    momentum: 0.95
    weight_decay: 0.0001
    schatten_r: inf
  muon_sam:
    optimizer: muon_sam
    lr: 0.015
    momentum: 0.95
    weight_decay: 0.0001
    rho: 0.0015
    rho_vector: 0.01
  atlas:
    optimizer: atlas
    lr: 0.015
    momentum: 0.95
    weight_decay: 0.0001
    rho: 0.0015
    rho_vector: 0.01
    schatten_r: inf
  atlas_raw:
    optimizer: atlas_raw
    lr: 0.015
    momentum: 0.95
    weight_decay: 0.0001
    rho: 0.0015
    rho_vector: 0.01
    schatten_r: inf
  atlas_random:
    optimizer: atlas_random
    lr: 0.015
    momentum: 0.95
    weight_decay: 0.0001
    rho: 0.0015
    rho_vector: 0.01
    schatten_r: inf
