experiment:
  experiment_id: pythia70m_v2
  wandb_project: V2-PTQ-Pythia70M
  task_type: causal_lm
  model_name: EleutherAI/pythia-70m
  dataset_name: HuggingFaceFW/fineweb-edu
  dataset_config: sample-10BT
  max_len: 2048
  total_tokens: 1400000000
  train_epochs: 14
batch_size: 16
grad_acc: 32
lr_schedule:
  type: wsd
  warmup_ratio: 0.05
  cooldown_ratio: 0.2
  min_lr_ratio: 0.0
parameter_routing:
  hidden_matrices: muon
  embeddings_and_head: adamw
optimizers:
  adam:
    optimizer: adam
    lr: 0.0006
    weight_decay: 0.1
  sgd:
    optimizer: sgd
    lr: 0.03
    momentum: 0.9
    nesterov: true
    weight_decay: 0.0
  muon:
    optimizer: muon
    lr: 0.02
    momentum: 0.95
    weight_decay: 0.0
    adam_lr: 0.0008
  sam:
    optimizer: sam
    lr: 0.03
    momentum: 0.9
    nesterov: true
    weight_decay: 0.0
    rho: 0.05
    fsam_lambda: 0.9
    fsam_sigma: 1.0
  fsam:
    optimizer: fsam
    lr: 0.03
    momentum: 0.9
    nesterov: true
    weight_decay: 0.0
    rho: 0.05
    fsam_lambda: 0.9
    fsam_sigma: 1.0
  muon_sam:
    optimizer: muon_sam
    lr: 0.02
    momentum: 0.95
    weight_decay: 0.0
    adam_lr: 0.0008
    rho: 0.01
    rho_vector: 0.01
    ns_steps: 5
    fsam_lambda: 0.9
    fsam_sigma: 1.0
  fsam_ortho_muon:
